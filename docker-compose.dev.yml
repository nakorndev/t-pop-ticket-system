services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: t_pop_ticket_system
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
  cache:
    image: redis:8-alpine
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
